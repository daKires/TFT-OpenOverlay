[package]
name = "tft-openoverlay"
version = "0.1.0"
description = "TFT-OpenOverlay desktop app"
edition = "2021"

[[bin]]
name = "tft-openoverlay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"